version: '3.8'

services:
  # 1. FastAPI 웹 서버
  api:
    build: .
    # [수정] sh -c를 사용해 CWD와 PYTHONPATH를 강제로 설정한 후 uvicorn을 실행합니다.
    command: sh -c "export PYTHONPATH=/app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app # 프로젝트 전체를 마운트합니다.
      - /Users/stephano/Desktop/한양대학교/4-인공지능프로젝트1, 2/Resume 저장용 테스트 폴더:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app # [수정] 이중으로 설정하여 확실하게 합니다.
      - DATABASE_URL=postgresql://user:password@db/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 2. Celery 워커
  worker:
    build: .
    # [수정] sh -c를 사용해 CWD와 PYTHONPATH를 강제로 설정한 후 celery를 실행합니다.
    command: sh -c "export PYTHONPATH=/app && celery -A app.celery_worker.celery_app worker --loglevel=info"
    volumes:
      - .:/app # 프로젝트 전체를 마운트합니다.
      - /Users/stephano/Desktop/한양대학교/4-인공지능프로젝트1, 2/Resume 저장용 테스트 폴더:/app/uploads
    environment:
      - PYTHONPATH=/app # [수정] 이중으로 설정하여 확실하게 합니다.
      - DATABASE_URL=postgresql://user:password@db/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 3. PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 4. Redis (Celery 메시지 브로커)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: