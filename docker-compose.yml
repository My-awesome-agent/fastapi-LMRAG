version: '3.8'

services:
  # 1. FastAPI 웹 서버
  api:
    build: .
    # [수정] --reload 옵션 제거 (DB 테이블 생성 충돌 방지)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app # 코드 변경 실시간 반영 (루트 마운트)
      - "/Users/stephano/Desktop/한양대학교/4-인공지능프로젝트1, 2/Resume 저장용 테스트 폴더:/app/uploads" # 업로드 폴더
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app # Dockerfile의 ENV와 함께 이중 보장
      - DATABASE_URL=postgresql://user:password@db/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 2. Celery 워커
  worker:
    build: .
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    volumes:
      - .:/app # 코드 변경 실시간 반영 (루트 마운트)
      - "/Users/stephano/Desktop/한양대학교/4-인공지능프로젝트1, 2/Resume 저장용 테스트 폴더:/app/uploads"
    environment:
      - PYTHONPATH=/app # ModuleNotFoundError 해결
      - DATABASE_URL=postgresql://user:password@db/appdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 3. PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data # DB 데이터 영구 보존
    ports:
      - "5432:5432" # 로컬에서 DB 툴로 접속 시 필요

  # 4. Redis (Celery 메시지 브로커)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # 로컬에서 Redis 툴로 접속 시 필요

volumes:
  postgres_data: # DB 데이터를 저장하기 위한 명명된 볼륨